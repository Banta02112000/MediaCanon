[project]
name = "canonsync"
version = "1.0.0"
description = "Transmedia canon tracker: reconciles IMDb + Trakt and lists missing canon entries"
requires-python = ">=3.10"
dependencies = [
  "flet==0.28.3",
  "requests>=2.32.3",
]

[tool.flet]
org = "com.banta"
product = "CanonSync"
company = "Banta"
copyright = "Copyright (c) Banta"

[tool.flet.app]
path = "src"

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.ACCESS_NETWORK_STATE" = true
"android.permission.READ_EXTERNAL_STORAGE" = true
"android.permission.WRITE_EXTERNAL_STORAGE" = true
